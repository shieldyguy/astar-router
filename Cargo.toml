[package]
name = "astar-router"
version = "0.1.0"
edition = "2021"
description = "A fast octilinear grid A* PCB autorouter: scene JSON in, plan JSON out. No dependencies."

[lib]
name = "astar"
path = "src/lib.rs"

[[bin]]
name = "astar"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
