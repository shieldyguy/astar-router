# The astar binary for Linux x86_64 and macOS arm64, which ./install.sh takes where there is no cargo.
# A release is made only when asked: push the commit to the branch `release`
# (git push origin main:release), and it is named build-<sha12>; a tag v* makes one under the tag's name.
# Nothing runs on an ordinary push.
name: release

on:
  push:
    branches: ["release"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: astar-linux-x86_64.tar.gz
          - os: macos-14
            asset: astar-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --quiet
      - name: self-check
        run: target/release/astar route tests/scenes/tiny11.json plan.json
      - name: package
        run: tar -czf ${{ matrix.asset }} -C target/release astar
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="$GITHUB_REF_NAME"; else name="build-${GITHUB_SHA:0:12}"; fi
          # the two jobs may both try to make the release: the second finds it there
          gh release view "$name" > /dev/null 2>&1 || gh release create "$name" --target "$GITHUB_SHA" --title "$name" --notes "astar at $GITHUB_SHA" || true
          gh release upload "$name" ${{ matrix.asset }} --clobber
